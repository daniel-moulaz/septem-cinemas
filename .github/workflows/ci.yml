name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://septem:ci_only_password@127.0.0.1:5432/septem_cinemas?schema=public
      JWT_SECRET: ci_only_jwt_secret_never_use_in_production_2026
      TICKET_SIGNING_SECRET: ci_only_ticket_secret_never_use_in_production_2026
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: septem
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: septem_cinemas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U septem -d septem_cinemas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed test fixtures
        run: npm run db:seed

      - name: Validate, lint, typecheck, test and build
        run: npm run check

      - name: Prove concurrency protections with isolated mutations
        run: npm run test:concurrency-proof
